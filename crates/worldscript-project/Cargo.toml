[package]
name = "worldscript-project"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Renderer-neutral WorldScript Studio project schema, validation, migration, and I/O (Wave 2)"
publish = false

[lib]
name = "worldscript_project"

[[bin]]
name = "wsproj"
path = "src/bin/wsproj.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
