[package]
name = "worldscript-secure-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Renderer-neutral R-15 protected-record primitives, key-provider contract and recovery KDF — Gates 1a/1b, headless"
publish = false

[lib]
name = "worldscript_secure_storage"

[dependencies]
# `zeroize` on both clears the AES key schedule (aes) and the derived GHASH key (aes-gcm) on drop.
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Native recovery KDF (WSS_ARGON2ID_V1). 0.5.x is the newest line within this crate's Rust 1.77.2
# minimum (0.6 needs 1.85); default features (password-hash/PHC strings) are not used.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
# argon2 requires base64ct; 1.7+ needs Rust 1.81+, so hold the 1.6 line (MSRV 1.60).
base64ct = "~1.6"
# 0.3.4 keeps rust-version 1.63. The 0.4 line is not admitted. `getrandom()` is `fill` on this line.
getrandom = "0.3"
# §8.2.1 passphrase encoding (NFC) — MSRV 1.36.
unicode-normalization = "0.1.25"
sha2 = "0.10"
# Held below 1.9, whose MSRV (1.85) exceeds this crate's 1.77.2; 1.8.x (MSRV 1.60) is API-compatible.
zeroize = { version = "~1.8", features = ["derive"] }
# Direct pin for the same reason: zeroize_derive 1.5 also requires Rust 1.85.
zeroize_derive = "~1.5"

# Gate 1b-platform slice D (§8.2.5): the real OS secure store, only behind the `platform-keystore`
# feature so the default Core build needs no platform libraries. keyring 3.6.x is the newest line
# within Rust 1.77.2 (4.x needs 1.88); its default credential builder is never used (see
# secure_store/platform.rs).
# Gate 4 slice 4A (§11.1): the cross-process `root_commit_mutex` is an operating-system advisory
# lock. rustix's safe `flock` on Unix (1.x, MSRV 1.63, already in the lockfile); on Windows one
# `LockFileEx` call through windows-sys 0.52 (MSRV 1.56, already in the lockfile).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service only: never `linux-native` / keyutils (not persistent, never a fallback).
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# 4.1+ needs Rust 1.78; hold 4.0.x (MSRV 1.70).
dbus-secret-service = { version = "~4.0.3", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["apple-native"] }
# 3.7 needs Rust 1.85; hold 3.6.x (MSRV 1.72).
security-framework = { version = "~3.6", optional = true, default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["windows-native"] }

[features]
# Test-only: exposes `seal_with_random` and `RandomSource` so the fixed vectors can inject a known
# nonce (§16). Production callers never enable it; the public `seal` always uses the OS CSPRNG.
test-randomness = []
# Test-only: exposes the in-memory, fault-injecting `memory_provider::MemoryKeyProvider` (§16).
test-support = ["test-randomness"]
# Real OS secure store (macOS Keychain, Windows Credential Manager, Linux Secret Service).
platform-keystore = ["dep:keyring", "dep:dbus-secret-service", "dep:security-framework"]

[dev-dependencies]
worldscript-secure-storage = { path = ".", features = ["test-support"] }
