# Docker image build + push to GitHub Container Registry on every tag.
# Pull with: docker pull ghcr.io/qnbs/worldscript-studio:latest

name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# QNBS-v3: top-level read-only follows principle of least privilege (CodeQL Token-Permissions).
permissions:
  contents: read

jobs:
  # QNBS-v3 (#911): exact-ref OSV audit of the commit this run would publish, on tag pushes and manual dispatches alike.
  security-audit:
    name: 🔒 Release security audit
    permissions:
      contents: read
    uses: ./.github/workflows/release-security-audit.yml
    with:
      expected-sha: ${{ github.sha }}

  build-push:
    name: Build & push image
    # QNBS-v3 (#911): every pushed tag (version, major.minor, and `latest` from metadata-action's latest=auto or the raw rule) waits on a successful audit of this exact SHA; no status function, so a failed, skipped or cancelled audit leaves this job unrun.
    needs: [security-audit]
    if: >-
      ${{ needs.security-audit.result == 'success' && needs.security-audit.outputs.audited-sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # QNBS-v3: packages:write scoped to this job only — prevents privilege escalation in future jobs.
    permissions:
      contents: read
      packages: write
    steps:
      # QNBS-v3: SHA-pinned to prevent supply-chain attacks via mutable tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # QNBS-v3 (#911): build exactly the audited commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
