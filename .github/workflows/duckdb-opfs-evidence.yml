# Evidence branch only (never merged), #716: DuckDB-WASM OPFS warnings (handle conflicts, circuit breaker, missing
# tables) were seen in dev-server E2E traces. This runs one spec against the dev server and against the production
# build and records every DuckDB/OPFS console line per phase (one tab, reload, second tab).
name: DuckDB OPFS evidence

on:
  push:
    branches: [evidence/duckdb-opfs-716]

permissions:
  contents: read

jobs:
  duckdb-opfs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Dev server run
        continue-on-error: true
        env:
          CI: 'true'
          RUN_DEEP_E2E: '1'
        run: pnpm exec playwright test tests/e2e/deep/duckdb/duckdb-opfs-evidence.spec.ts --project=chromium --retries=0 --reporter=list
      - name: Production build
        run: pnpm run build
      - name: Production build run
        continue-on-error: true
        env:
          CI: 'true'
          RUN_DEEP_E2E: '1'
        run: pnpm exec playwright test -c playwright.duckdb-evidence.config.ts tests/e2e/deep/duckdb/duckdb-opfs-evidence.spec.ts --project=chromium --retries=0 --reporter=list
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duckdb-opfs-evidence
          path: |
            tests/e2e/html-report
            test-results
          retention-days: 14
