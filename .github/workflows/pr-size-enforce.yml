name: PR Size Enforcement (reusable)

# QNBS-v3 (#510): invoked only via a SHA-pinned cross-repo `uses:` reference from ci.yml's `pr-size` job — GitHub always resolves that reference against the exact pinned commit, never the calling `pull_request` run's own ref, so a same-repo PR editing ci.yml or this file on its own branch has zero effect on which code executes here; `github.event.*` below is the shared context of the original triggering event, so base/head/number are read directly rather than accepted as caller-supplied inputs, which could otherwise be fabricated.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  enforce:
    name: Evaluate and report PR size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # QNBS-v3: ref pins the checkout to the PR's recorded base commit, never the PR's own merge/head ref, so the checked-out scripts/check-pr-size.mjs is guaranteed the trusted base copy — no git-show/temp-file indirection needed to escape a PR-controlled checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      # QNBS-v3: the PR's commits are fetched as data only (never checked out/executed) so the base-ref checker below can diff/count against the real head; the fetched SHA is verified against the trusted event payload to guard against a mid-run ref mutation race.
      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          FETCHED_HEAD="$(git rev-parse "refs/remotes/origin/pr/${PR_NUMBER}")"
          if [ "$FETCHED_HEAD" != "$PR_HEAD_SHA" ]; then
            echo "::error::fetched PR ref does not match the event head SHA"
            exit 1
          fi

      - name: Evaluate PR size (trusted base-ref checker)
        id: size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          set +e
          node scripts/check-pr-size.mjs "$BASE_SHA" "$HEAD_SHA" | tee /tmp/pr-size-report.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      # QNBS-v3: fork PRs get a read-only token — a failed comment must never fail this advisory job.
      # QNBS-v3: edits by owned comment ID (not --edit-last) so an intervening bot comment can't be overwritten.
      - name: Post PR size comment (advisory or blocking tiers only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          MARKER="<!-- pr-size-governance -->"
          # QNBS-v3: --paginate + --jq filters each page separately — pipe to external jq -s to combine first.
          OWNED_ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" 2>/dev/null \
            | jq -s --arg marker "$MARKER" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))] | last | .id // empty' \
            || echo "")
          if grep -qE 'within target' /tmp/pr-size-report.txt; then
            if [ -n "$OWNED_ID" ]; then
              printf '%s\nPR size is back within target — previous warning below is resolved.\n' "$MARKER" > /tmp/pr-size-resolved.txt
              gh api "repos/$REPO/issues/comments/$OWNED_ID" -X PATCH -F body=@/tmp/pr-size-resolved.txt || true
            fi
            exit 0
          fi
          { printf '%s\n' "$MARKER"; cat /tmp/pr-size-report.txt; } > /tmp/pr-size-marked.txt
          if [ -n "$OWNED_ID" ]; then
            gh api "repos/$REPO/issues/comments/$OWNED_ID" -X PATCH -F body=@/tmp/pr-size-marked.txt || true
          else
            gh pr comment "$PR" --body-file /tmp/pr-size-marked.txt || true
          fi

      # QNBS-v3: any nonzero exit (crash, OOM-kill, etc.) must fail, not just the literal '1' ceiling code.
      - name: Fail on a checker crash or an absolute-ceiling violation
        if: steps.size.outputs.exit_code != '0'
        run: exit 1
