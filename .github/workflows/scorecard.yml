name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'   # every Monday 04:30 UTC
  workflow_dispatch:

# Minimal read-all default; individual job overrides what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload SARIF to Code scanning
      security-events: write
      # Needed for scorecard to sign its attestation with Sigstore OIDC
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # QNBS-v3: publish_results=false — api.scorecard.dev times out on push runs (context deadline exceeded); SARIF still uploads to GitHub Code Scanning
          publish_results: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
