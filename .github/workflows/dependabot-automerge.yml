# QNBS-v3: proposed during the deployment-surface/OpenRouter audit (2026-07-28) — a 31-day commit
# gap let 20 Dependabot PRs stack up (see AUDIT.md / TODO.md). Auto-merging PATCH-only bumps once
# CI is green cuts that latency without touching the judgment calls minor/major bumps deserve. The
# existing dev-tooling/tauri-deps groups and the 7-day release cooldown (.npmrc minimum-release-age)
# are unchanged — this only adds a merge step gated on CI + semver-patch.
name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge patch-level Dependabot PRs
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # QNBS-v3: patch-only, on purpose — minor/major bumps (or any bump outside npm/cargo/
      # github-actions, e.g. a group update mixing semver levels) still need a human look.
      - name: Enable auto-merge for semver-patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
