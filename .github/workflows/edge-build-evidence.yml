# Evidence branch only (never merged), #1272: the Vercel edge build of be27bfbe failed the worker-bundle guard
# (assets/duckdbMigration-*.js inlines TypeScript as data:video/mp2t). A fresh runner build and a cached sequence on
# Node 22 both pass. Vercel built with Node 26.x (engines ">=22.19.0" picks the newest major). This builds the edge
# target of be27bfbe on Node 22, 24 and 26 and reports the chunk and any inlined source.
name: Edge build evidence (#1272)

on:
  push:
    branches: [evidence/edge-build-1272]

permissions:
  contents: read

jobs:
  node-versions:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Edge build
        id: build
        continue-on-error: true
        run: node --version && pnpm run build:edge
      - name: Report
        if: always()
        run: |
          echo "node=${{ matrix.node }} build outcome: ${{ steps.build.outcome }}"
          ls -la dist/assets | grep -E "duckdbMigration|workerBusManager" || true
          node scripts/evidence/inline-report.mjs dist
