# Desktop bundles — manual or tagged releases (does not block web CI).
# Produces installable artifacts per OS under Actions → workflow run → Artifacts.

name: Tauri desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-tag:
    name: Verify release tag
    if: >-
      ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verified-tag-sha: ${{ steps.verify.outputs.verified-tag-sha }}
    steps:
      # QNBS-v3 (#1206): the verifier comes from an immutable protected-main commit, never from the tag under verification.
      - name: Check out the pinned trusted verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d46ae7969b6a8034de0c998ac3376e4fb7474f4a
          path: trusted-verifier
          fetch-depth: 1
          persist-credentials: false
      - name: Verify GitHub signatures for the release tag
        id: verify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: trusted-verifier
        run: >-
          set -euo pipefail && env -i PATH="$PATH" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME"
          GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_REF_NAME="$GITHUB_REF_NAME"
          GITHUB_REF_TYPE="$GITHUB_REF_TYPE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
          GITHUB_SHA="$GITHUB_SHA" GITHUB_TOKEN="$GITHUB_TOKEN"
          node scripts/signing/verify-github-signatures.mjs &&
          echo "verified-tag-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # QNBS-v3 (#911): exact-ref OSV audit of the tagged commit; `release` runs only on its success for the identical SHA.
  security-audit:
    name: 🔒 Release security audit (exact ref)
    needs: [verify-release-tag]
    if: >-
      ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      audited-sha: ${{ steps.result.outputs.audited-sha }}
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Validate the requested commit SHA
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected SHA must be a full 40-character commit SHA, got '${EXPECTED_SHA}'"
            exit 1
          fi

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout provenance and audit inputs
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::checked out ${HEAD_SHA}, expected ${EXPECTED_SHA}"
            exit 1
          fi
          for input in src-tauri/osv-scanner.toml pnpm-lock.yaml src-tauri/Cargo.lock crates/Cargo.lock; do
            if [ ! -s "$input" ]; then
              echo "::error::missing or empty audit input ${input}"
              exit 1
            fi
          done

      # Same pinned scanner, config and lockfiles as the CI Security Audit; any finding or scanner error fails this step.
      - name: OSV vulnerability scan (all three lockfiles)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=src-tauri/osv-scanner.toml
            --lockfile=pnpm-lock.yaml
            --lockfile=src-tauri/Cargo.lock
            --lockfile=crates/Cargo.lock

      - name: Record the audited SHA
        id: result
        run: echo "audited-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # QNBS-v3: cheap defense-in-depth gate (no pnpm install needed) so a Rust/npm plugin mismatch fails in seconds, not after the ~45min matrix — the v1.28.5 failure class.
  # QNBS-v3: needs verify-release-tag so a tag that fails signature verification never gets this job's checkout+script execution either, not just the bundle matrix.
  parity-preflight:
    name: 🔍 Tauri plugin parity preflight
    needs: [verify-release-tag]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.verify-release-tag.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Verify Tauri plugin Rust/npm version parity
        run: node scripts/check-tauri-plugin-versions.mjs

  # QNBS-v3: workflow_dispatch on protected main signs a throwaway payload with the stored updater secret and verifies it against the shipped public key; no release artifacts are published.
  updater-signing-preflight:
    name: 🔐 Verify stored updater signing key
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri
          cache-all-crates: true
          prefix-key: "v1-updater-signing-probe"
      - name: Install Linux dependencies for the configured verifier example
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Verify exact main source and write a non-secret probe payload
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EXPECTED_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf '%s\n' 'WorldScript Studio updater signing preflight v1' > "$RUNNER_TEMP/worldscript-updater-probe.bin"
      - name: Sign and cryptographically verify the configured updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::updater signing secret is empty"; exit 1; }
          VERSION="$(node -p "require('./package.json').version")"
          PROBE="$RUNNER_TEMP/worldscript-updater-probe.bin"
          pnpm exec tauri signer sign --app-version "$VERSION" "$PROBE" >/dev/null
          test -s "$PROBE.sig"
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify-updater-artifact -- "$PROBE" "$PROBE.sig"
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify-updater-artifact -- "$PROBE" "$PROBE.sig" --expect-failure --tamper
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify-updater-artifact -- "$PROBE" "$PROBE.sig" --expect-failure --wrong-key

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [verify-release-tag, parity-preflight]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.parity-preflight.result == 'success' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            needs.verify-release-tag.result == 'success' &&
            needs.verify-release-tag.outputs.verified-tag-sha == github.sha
          )
        )
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          # QNBS-v3: macos-13 (the last Intel/x86_64 hosted runner) removed 2026-07-28 -- it never
          # actually provisions a runner (job sits in "queued" indefinitely; timeout-minutes never
          # applies since that only counts once a job starts, so 3 consecutive real runs each hung
          # the full 24h GitHub Actions queue ceiling before auto-cancelling). GitHub has been
          # retiring Intel-hosted macOS runners; macos-latest (Apple Silicon) is the only macOS
          # bundle target until a working Intel option exists again. Native Intel-Mac builds are
          # tracked as a re-opened follow-up, not silently dropped.
          - os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # QNBS-v3: composite action handles pnpm/node setup + frozen install.
      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri
          cache-all-crates: true
          # QNBS-v3: bump prefix-key when changing Rust channel or after major Cargo.lock churn
          prefix-key: "v1"

      - name: Install Linux dependencies (WebKitGTK)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install macOS dependencies (create-dmg)
        if: contains(matrix.os, 'macos')
        run: brew install create-dmg

      # QNBS-v3: per-target inventory (#871) — the linked crate set differs per OS, so each bundle job generates the notices it ships and the SBOM the release attaches; a component without license metadata fails the build here.
      - name: Generate third-party notices and SBOM
        id: third_party
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-third-party-inventory.mjs --out third-party
          cat third-party/*.third-party-notices.txt | sed -n '/^Licenses flagged/,/^------/p' >> "$GITHUB_STEP_SUMMARY"

      - name: Build Tauri app
        shell: bash
        env:
          NOTICES_FILE: ${{ steps.third_party.outputs.notices_file }}
          # Updater signing (minisign) — required for auto-update functionality
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # QNBS-v3: macOS/Windows code signing env vars are intentionally omitted
          # until Apple Developer ID and Authenticode certificates are provisioned.
          # Add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID,
          # APPLE_TEAM_ID, APPLE_PASSWORD, WINDOWS_CERTIFICATE,
          # WINDOWS_CERTIFICATE_PASSWORD here when ready.
        run: |
          # QNBS-v3: Strict mode for reliable error handling.
          # Best Practice 2026: set -euo pipefail catches undefined vars and pipe failures early.
          set -euo pipefail

          # QNBS-v3: Skip updater signing for workflow_dispatch test builds.
          # Tagged releases (v*) require valid secrets for both signing and updater.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            # Disable updater artifacts when no private key is available;
            # otherwise Tauri errors: "public key found, but no private key".
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
            mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          fi

          # QNBS-v3: Validate jq succeeded before proceeding
          if ! command -v jq &>/dev/null; then
            echo "::error::jq is required for Tauri build configuration but not installed"
            exit 1
          fi

          # QNBS-v3: the notices are merged into bundle.resources only for this build, so local `tauri dev/build` never depends on a generated file.
          test -s "third-party/${NOTICES_FILE}"
          RESOURCES="$(jq -cn --arg src "../third-party/${NOTICES_FILE}" '{bundle: {resources: {($src): "THIRD_PARTY_NOTICES.txt"}}}')"

          echo "Building Tauri app for ${{ matrix.os }}..."
          pnpm exec tauri build --config "$RESOURCES"
          echo "Tauri build completed successfully"

      # QNBS-v3: the updater key probe proves key compatibility; verify each real target sidecar before its bundle can be uploaded.
      - name: Cryptographically verify signed bundle artifacts
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          find_bundle_asset() {
            local name="$1"
            # QNBS-v3: Tauri's published bundle names use dots for spaces; accept either exact basename while rejecting ambiguous duplicates.
            local dotted_name="${name// /.}"
            local -a matches=()
            while IFS= read -r -d '' match; do
              matches+=("$match")
            done < <(find src-tauri/target/release/bundle -type f \( -name "$name" -o -name "$dotted_name" \) -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected exactly one bundle asset named $name, found ${#matches[@]}"
              return 1
            fi
            printf '%s' "${matches[0]}"
          }

          verify_bundle_signature() {
            local artifact="$1"
            test -s "$artifact"
            test -s "$artifact.sig" || { echo "::error::missing signature sidecar for ${artifact##*/}"; exit 1; }
            cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify-updater-artifact -- "$artifact" "$artifact.sig"
          }

          case "$RUNNER_OS" in
            Linux)
              verify_bundle_signature "$(find_bundle_asset "WorldScript Studio_${VERSION}_amd64.deb")"
              verify_bundle_signature "$(find_bundle_asset "WorldScript Studio-${VERSION}-1.x86_64.rpm")"
              verify_bundle_signature "$(find_bundle_asset "WorldScript Studio_${VERSION}_amd64.AppImage")"
              ;;
            Windows)
              verify_bundle_signature "$(find_bundle_asset "WorldScript Studio_${VERSION}_x64-setup.exe")"
              verify_bundle_signature "$(find_bundle_asset "WorldScript Studio_${VERSION}_x64_en-US.msi")"
              ;;
            macOS)
              verify_bundle_signature "$(find_bundle_asset 'WorldScript Studio.app.tar.gz')"
              ;;
            *)
              echo "::error::unsupported runner OS for updater signature verification: $RUNNER_OS"
              exit 1
              ;;
          esac

      - name: Upload bundle directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
            third-party/
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------------
  # GitHub Release: attach Linux / Windows / macOS installers (tags v* only)
  # -----------------------------------------------------------------
  release:
    name: GitHub Release
    # QNBS-v3 (#911): no status function in `if`, so any failed, skipped or cancelled need (bundle or security-audit) leaves this job unrun.
    needs: [bundle, security-audit, verify-release-tag]
    if: >-
      ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.verify-release-tag.result == 'success' && needs.verify-release-tag.outputs.verified-tag-sha == github.sha && needs.security-audit.result == 'success' && needs.security-audit.outputs.audited-sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the exact audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download all bundle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tauri-bundle-*
          path: downloaded
          merge-multiple: false

      - name: Extract deterministic release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "] — ") == 1 { in_release = 1 }
            in_release && $0 ~ /^## \[/ && index($0, "## [" version "] — ") != 1 { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          grep -Fq "## [$VERSION] — " release-notes.md
          if grep -Eiq '(#332|#341).*(closed|resolved|complete|shipped|fixed)|(#332|#341).*(closure|done)' release-notes.md; then
            echo "::error::Release notes claim #332 or #341 closure"
            exit 1
          fi
          if grep -Eiq '(macOS|Mac)[^\n]*(Intel|x86_64)[^\n]*(supported|available|provided|published|built)|Intel[^\n]*(macOS|Mac)[^\n]*(supported|available|provided|published|built)' release-notes.md; then
            echo "::error::Release notes claim unsupported Intel macOS support"
            exit 1
          fi

      - name: Collect and require the complete installer, updater, SBOM, and notices matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -d downloaded
          mkdir -p release-assets
          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"
            if [ -e "release-assets/$NAME" ]; then
              echo "::error::duplicate release asset name: $NAME"
              exit 1
            fi
            cp -- "$FILE" "release-assets/$NAME"
          done < <(find downloaded -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
            -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \
            \) -print0)
          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"
            if [ -e "release-assets/$NAME" ]; then
              echo "::error::duplicate release asset name: $NAME"
              exit 1
            fi
            cp -- "$FILE" "release-assets/$NAME"
          done < <(find downloaded -type f \( -name '*.third-party-notices.txt' -o -name '*.cdx.json' \) -print0)
          node scripts/release-assets-guard.mjs assets "$VERSION" release-assets

      - name: Generate and validate all three signed updater manifest entries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-assets-guard.mjs generate "$VERSION" release-assets "$GITHUB_REPOSITORY"
          node scripts/release-assets-guard.mjs validate "$VERSION" release-assets "$GITHUB_REPOSITORY"

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate --jq '.[] | [.tag_name, (.draft | tostring)] | @tsv' \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.tsv"
          awk -F '\t' -v tag="$TAG" '
            $1 == tag { found = 1; if ($2 != "true") published = 1 }
            END {
              if (published) { print "::error::a published release already exists for this tag; refusing overwrite"; exit 1 }
              if (found) print "Existing draft release found; only this same tag draft may be resumed."
              else print "No release exists for this tag; a validated draft may be created."
            }
          ' "$RUNNER_TEMP/existing-releases.tsv"

      - name: Stage GitHub Release as a draft
        id: stage_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          body_path: release-notes.md
          generate_release_notes: false
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the complete uploaded draft asset inventory and SHA-256 digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.stage_release.outputs.id }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$RELEASE_ID" || { echo "::error::draft release action did not return a release ID"; exit 1; }
          DRAFT="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          test "$DRAFT" = true || { echo "::error::release must remain a draft until every uploaded asset is verified"; exit 1; }
          gh api --paginate --jq '.[] | [.name, (.size | tostring), (.digest // "")] | @tsv' \
            "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/release-assets.tsv"
          node scripts/release-assets-guard.mjs remote "$VERSION" release-assets "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-assets.tsv"

      - name: Publish the verified complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.stage_release.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID" || { echo "::error::draft release action did not return a release ID"; exit 1; }
          STAGED_TAG="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.tag_name')"
          test "$STAGED_TAG" = "$TAG" || { echo "::error::staged release tag changed before publication"; exit 1; }
          DRAFT="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          test "$DRAFT" = true || { echo "::error::release must remain a draft until its final asset inventory is verified"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          gh api --paginate --jq '.[] | [.name, (.size | tostring), (.digest // "")] | @tsv' \
            "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/prepublish-release-assets.tsv"
          node scripts/release-assets-guard.mjs remote "$VERSION" release-assets "$GITHUB_REPOSITORY" "$RUNNER_TEMP/prepublish-release-assets.tsv"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false --jq 'if .draft == false then .html_url else error("release remained a draft") end'

      - name: Verify published release state and final asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.stage_release.outputs.id }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED_TAG="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.tag_name')"
          DRAFT="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          test "$PUBLISHED_TAG" = "$TAG" || { echo "::error::published release tag changed during final verification"; exit 1; }
          test "$DRAFT" = false || { echo "::error::release is not publicly published after the visibility update"; exit 1; }
          gh api --paginate --jq '.[] | [.name, (.size | tostring), (.digest // "")] | @tsv' \
            "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/published-release-assets.tsv"
          node scripts/release-assets-guard.mjs remote "$VERSION" release-assets "$GITHUB_REPOSITORY" "$RUNNER_TEMP/published-release-assets.tsv"
