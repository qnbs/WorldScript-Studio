# ============================================================
# WorldScript Studio – CEF Learning Harness (Wave 2 bootstrap)
#
# docs/cef/ROADMAP-CEF-DESKTOP-MIGRATION.md §3142 (Wave 2 deliverables), ADR-0020
# (CEF binding choice — the Wave 2 spike this harness formalizes into a real,
# repo-committed, CI-run check per §61.1.4's evidence-link discipline).
#
# Two increments live here:
# 1. Fetch + verify the pinned CEF SDK, report a clean-machine Linux runtime-
#    dependency inventory (before any apt-get), and print real version diagnostics.
# 2. Build apps/desktop-cef's worldscript_host against that SDK, serve the real
#    production bundle (pnpm run build's dist/), and run repeated start/close
#    cycles against it under Xvfb — the roadmap's literal "isolated learning
#    harness" / "safe repeated startup/shutdown" / "existing dist/" deliverables,
#    plus the FFI boundary proven from inside the real host, not just in isolation.
#
# Advisory only: not part of the required `ci-success` aggregator. Wave 2 is still
# in progress; this harness informs it rather than gating unrelated PRs on it.
#
# Trigger scope is deliberately asymmetric: `pull_request` stays path-scoped to
# CEF-specific files, so this ~30-minute, ~300MB-download job doesn't tax every
# unrelated content/feature PR. `push` to main has NO path filter — it runs the
# real production bundle through worldscript_host on every merge, so a
# CEF-rendering regression introduced by an unrelated app-source PR is still
# caught promptly (informationally, non-blocking), not silently missed until
# someone next happens to touch a CEF-specific path.
#
# QNBS-v3: docs/cef/** deliberately excluded from the PR path list — a docs-only
# change (e.g. updating the competency matrix) can't regress the built host, so it
# doesn't need a ~30min rebuild; code changes under apps/desktop-cef/** or
# scripts/cef/** still trigger this regardless of whether docs are also touched.
# The push-to-main trigger stays deliberately unscoped (no `paths:`) precisely so an
# unrelated app-source change that alters dist/'s real inputs is still caught after
# merge — narrowing that trigger to apps/desktop-cef/** only would reintroduce the
# PR #388 gap this design already closed.
#
# QNBS-v3: `fast-gate` (lint+typecheck) runs before `harness` so a trivial code-style
# or type error fails in ~2-3min instead of after the full ~30min SDK+CMake+Rust+Xvfb
# cycle. `Swatinem/rust-cache` caches cargo's registry/git dirs for the rust-core
# crate Corrosion builds via CMake, cutting redundant crates.io re-fetches.
#
# QNBS-v3: CMAKE_BUILD_TYPE stays Release (RelWithDebInfo broke CEF's own chrome-sandbox
# copy step — the fetched SDK's prebuilt binaries only ship Release/ and Debug/
# subdirectories, so CEF's build macros looked for a nonexistent RelWithDebInfo/ source
# path; a real CI failure, not a guess). worldscript_host gets its own -g flag directly
# (apps/desktop-cef/CMakeLists.txt) instead, for the crash-symbolization proof
# (scripts/cef/run-symbolization-proof.mjs)'s dump_syms/minidump-stackwalk to resolve
# function names against. Both tools are standalone Rust projects with tiny prebuilt
# Linux binaries — neither needs a Chromium checkout, confirmed by reading their
# own READMEs directly.
# ============================================================

name: 🧪 CEF Learning Harness

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop-cef/**'
      - 'scripts/cef/**'
      - '.github/workflows/cef-learning-harness.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cef-learning-harness-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # QNBS-v3: fast, cheap checks (lint/typecheck) gate the ~30min CEF build so a trivial
  # code-style or type error doesn't burn the full SDK-fetch+CMake+Rust+Xvfb cycle before
  # surfacing. Duplicates a subset of ci.yml's quality job (which runs in parallel anyway) —
  # deliberate trade: a couple extra lint/typecheck minutes vs. up to 30 wasted on a fail-fast case.
  fast-gate:
    name: ⚡ Fast gate (lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint (Biome)
        run: pnpm run lint
      - name: Typecheck (tsgo)
        run: npx tsgo --project tsconfig.tsgo.json --noEmit --checkers 4

  harness:
    name: 🧪 CEF host build, dependency inventory, launch-cycle proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fast-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      # Runs on the stock runner before any apt-get — the "clean machine" data point
      # docs/cef/knowledge/linux-runtime-notes.md flags as still open.
      - name: Clean-machine Linux dependency inventory
        run: node scripts/cef/check-linux-runtime-deps.mjs

      # QNBS-v3: diagnostic-only, no behavior change — real evidence on whether this runner can
      # even support Chromium's Linux sandbox (Sandbox posture row, native-readiness.md, "Not yet
      # attempted") before any attempt to actually enable it. Non-fatal by design.
      - name: Linux sandbox feasibility inventory (diagnostic only)
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/cef/check-linux-sandbox-inventory.mjs | tee "$RUNNER_TEMP/cef-sandbox-inventory.txt"

      - name: Restore CEF SDK cache
        id: cef-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cef-cache
          key: cef-sdk-${{ hashFiles('scripts/cef/cef-version.json') }}

      - name: Fetch + verify CEF SDK
        run: |
          set -o pipefail
          CEF_DIR=$(node scripts/cef/fetch-cef-sdk.mjs --cache-dir .cef-cache | tail -1)
          echo "CEF_DIR=$CEF_DIR" >> "$GITHUB_ENV"

      - name: Print CEF version diagnostics
        run: node scripts/cef/print-cef-version-diagnostics.mjs "$CEF_DIR"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # QNBS-v3: rust-core (apps/desktop-cef/rust-core) is built via CMake's corrosion_import_crate,
      # invoking cargo under the hood — this caches the global registry/git dirs cargo uses regardless
      # of where Corrosion places its target/ output, so repeat runs skip re-fetching crates.io deps.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop-cef/rust-core -> target

      # QNBS-v3: /var/cache/apt/archives is root-owned by default — actions/cache's restore
      # (tar extraction) runs as the unprivileged runner user and fails with "Permission denied"
      # on every file without this, silently degrading to a cache miss every time (real CI
      # evidence: "Cache hit" followed immediately by "Cache not found" from the failed tar).
      - name: Make apt archive cache dir writable by the runner user
        run: sudo mkdir -p /var/cache/apt/archives/partial && sudo chown -R runner:runner /var/cache/apt/archives && sudo chmod -R 755 /var/cache/apt/archives

      - name: Cache apt packages (CEF host + Wayland build deps)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          # QNBS-v3: bump the -v suffix if either apt-get install package list in this job changes
          key: apt-cef-harness-deps-v1

      - name: Install worldscript_host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libx11-dev xvfb

      - uses: ./.github/actions/setup

      - name: Build WorldScript Studio production bundle
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Configure + build worldscript_host
        run: |
          set -o pipefail
          BUILD_SRC_DIR=$(node scripts/cef/prepare-cef-build.mjs "$CEF_DIR" build | tail -1)
          cmake -S "$BUILD_SRC_DIR" -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target worldscript_host --parallel "$(nproc)"

      - name: List worldscript_host output directory (diagnostic)
        run: ls -la build/worldscript_host/

      # QNBS-v3: CEF's own COPY_FILES step copies chrome-sandbox with normal permissions — real CI evidence (PR #404) showed Chromium's setuid_sandbox_host.cc treats a present-but-misconfigured helper as FATAL rather than silently falling back to unprivileged user namespaces, so this standard CEF/Chromium packaging step (chown root + mode 4755) is required before any sandboxed launch, matching how a real .deb/AppImage installer would need to set this up too.
      - name: Set up SUID sandbox helper (chrome-sandbox)
        run: |
          sudo chown root:root build/worldscript_host/chrome-sandbox
          sudo chmod 4755 build/worldscript_host/chrome-sandbox
          ls -la build/worldscript_host/chrome-sandbox

      - name: Linux runtime linkage check (ldd against shipped .so files)
        run: node scripts/cef/check-linux-runtime-linkage.mjs build/worldscript_host

      # QNBS-v3: real CI evidence (PR #404) — under the now-real sandbox, Crashpad's Linux ptrace-based dump generation FATALs with "ptrace: Operation not permitted"; Yama LSM's default ptrace_scope=1 restricts ptrace to direct-descendant relationships and cross-namespace ptrace additionally needs CAP_SYS_PTRACE within the *target's* own user namespace, which the (now also sandboxed) crash handler no longer has for a renderer in a different namespace — this relaxes only the CI-runner's own Yama policy (a distro/kernel hardening layer, separate from and unaffected by Chromium's own sandbox flags) to isolate whether Yama alone is the blocker, diagnostic-only, never shipped to users.
      - name: Relax Yama ptrace_scope for Crashpad-under-sandbox diagnostic (CI-only)
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      # QNBS-v3: pinned prebuilt release binaries (~3.6MB each), sha256-verified — not built from
      # source (would need a slow cargo build for two more Rust tools) and not a Chromium
      # checkout (neither tool needs one; see the header comment).
      - name: Fetch dump_syms + minidump-stackwalk (crash-symbolization tools)
        run: |
          set -euo pipefail
          mkdir -p symtools
          curl -sSL --fail --retry 3 --retry-all-errors "https://github.com/mozilla/dump_syms/releases/download/v2.3.9/dump_syms-x86_64-unknown-linux-gnu.tar.xz" -o symtools/dump_syms.tar.xz
          curl -sSL --fail --retry 3 --retry-all-errors "https://github.com/rust-minidump/rust-minidump/releases/download/v0.27.0/minidump-stackwalk-x86_64-unknown-linux-gnu.tar.xz" -o symtools/mds.tar.xz
          echo "0fc852a86b00337407d9d423cc388a24c3b489ccaaedcf92623cad57af5ca8ad  symtools/dump_syms.tar.xz" | sha256sum -c -
          echo "0020324c54cc359596e927ee907204f4c8d4da6718765536edcabaa1622122ad  symtools/mds.tar.xz" | sha256sum -c -
          tar xf symtools/dump_syms.tar.xz -C symtools
          tar xf symtools/mds.tar.xz -C symtools
          DUMP_SYMS_BIN=$(find symtools -name dump_syms -type f -print -quit)
          MINIDUMP_STACKWALK_BIN=$(find symtools -name minidump-stackwalk -type f -print -quit)
          test -x "$DUMP_SYMS_BIN" || { echo "dump_syms binary not found in archive" >&2; exit 1; }
          test -x "$MINIDUMP_STACKWALK_BIN" || { echo "minidump-stackwalk binary not found in archive" >&2; exit 1; }
          echo "DUMP_SYMS_BIN=$(pwd)/$DUMP_SYMS_BIN" >> "$GITHUB_ENV"
          echo "MINIDUMP_STACKWALK_BIN=$(pwd)/$MINIDUMP_STACKWALK_BIN" >> "$GITHUB_ENV"

      - name: Serve production bundle + repeated launch/close proof
        run: |
          python3 -m http.server 8080 --directory dist &
          SERVER_PID=$!
          # QNBS-v3: GitHub Actions runs bash steps with -e by default — a failing node proof would previously skip the plain `kill` below entirely, leaking the http.server past this step. Real gap found alongside PR #404's sandbox work; applied here too, not just the new step.
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          xvfb-run -a node scripts/cef/run-launch-cycle-proof.mjs \
            "$(pwd)/build/worldscript_host/worldscript_host" \
            "http://localhost:8080/" --cycles 3

      - name: Crash-symbolization proof (dump_syms + minidump-stackwalk)
        run: |
          xvfb-run -a node scripts/cef/run-symbolization-proof.mjs \
            "$(pwd)/build/worldscript_host/worldscript_host" \
            "$DUMP_SYMS_BIN" \
            "$MINIDUMP_STACKWALK_BIN"

      - name: Real Linux sandbox-status proof (no_sandbox=false)
        id: sandbox-status
        # QNBS-v3: first real attempt, genuinely unverified against live CI — continue-on-error keeps a failure here from also blocking the Wayland smoke step below (same lesson as the accessibility PR #391→#397 regression); remove once this has real, reliable green evidence.
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m http.server 8082 --directory dist &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          xvfb-run -a node scripts/cef/run-sandbox-status-proof.mjs \
            "$(pwd)/build/worldscript_host/worldscript_host" \
            "http://localhost:8082/" | tee "$RUNNER_TEMP/cef-sandbox-status.txt"

      - name: Best-effort Wayland launch smoke (roadmap §44.2)
        id: wayland-smoke
        continue-on-error: true
        run: |
          sudo apt-get install -y weston
          python3 -m http.server 8081 --directory dist &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          node scripts/cef/run-wayland-smoke.mjs \
            "$(pwd)/build/worldscript_host/worldscript_host" \
            "http://localhost:8081/"

      - name: Summary
        if: always()
        run: |
          echo "## 🧪 CEF Learning Harness" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pinned SDK: \`$(node -e "console.log(require('./scripts/cef/cef-version.json').cefVersion)")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache hit: \`${{ steps.cef-cache.outputs.cache-hit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- worldscript_host built and repeated launch/close cycles proven against the real production bundle (dist/), under Xvfb." >> "$GITHUB_STEP_SUMMARY"
          echo "- Linux runtime linkage (ldd against the shipped worldscript_host + libcef.so, not just dpkg package presence): see the \"Linux runtime linkage check\" step above." >> "$GITHUB_STEP_SUMMARY"
          echo "- Crash-symbolization proof: a self-induced browser-process crash resolved via dump_syms + minidump-stackwalk against our own DWARF debug info — Chromium/CEF-internal frames remain unsymbolized (no debug-symbols archive is published for this distribution)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Linux sandbox feasibility inventory (diagnostic only, pre-dates the real enable attempt below):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cef-sandbox-inventory.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(inventory output unavailable)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- Real Linux sandbox-status proof (no_sandbox=false, per-process Seccomp/NoNewPrivs/user-ns evidence): \`${{ steps.sandbox-status.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cef-sandbox-status.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(sandbox-status output unavailable)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- Wayland smoke (best-effort, roadmap §44.2): \`${{ steps.wayland-smoke.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Not yet in scope: X11/Wayland matrix beyond this one runner, full real-hardware/GPU/display-server sandbox matrix, accessibility-tree observability (AT-SPI — state enablement is proven, see the launch-cycle-proof step)." >> "$GITHUB_STEP_SUMMARY"
