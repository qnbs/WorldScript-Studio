name: Reviewer Governance Trust Boundary

on:
  # QNBS-v3: this workflow is read from the base ref and never executes the PR workspace.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  reviewer-governance-trust:
    name: Reviewer Governance Trust Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # QNBS-v3: checkout is the trusted base workflow/repository; the PR is fetched only as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.22.0
          install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install trusted base dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Validate PR reviewer governance as untrusted data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EXPECTED_ADMISSION_POLICY_SHA256: 0a3b584a4460ab49d3e95d3fd235bd34edd10fa903ff4e6b1d0fcae2a4ac432b
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          FETCHED_HEAD="$(git rev-parse "refs/remotes/origin/pr/${PR_NUMBER}")"
          if [ "$FETCHED_HEAD" != "$PR_HEAD_SHA" ]; then
            echo "::error::fetched PR ref does not match the event head SHA"
            exit 1
          fi
          enforce_protected_policy_diff() {
            git diff --quiet "$PR_BASE_SHA" "$PR_HEAD_SHA" -- scripts/check-reviewer-config.mjs scripts/workflow-policy-check.mjs || exit 1
          }
          BASE_HAS_ADMISSION_POLICY="$(
            git show "$PR_BASE_SHA:scripts/workflow-policy-check.mjs" 2>/dev/null \
              | grep -c 'checkMergeAdmissionGate' || true
          )"
          HEAD_HAS_ADMISSION_POLICY="$(
            git show "$PR_HEAD_SHA:scripts/workflow-policy-check.mjs" 2>/dev/null \
              | grep -c 'checkMergeAdmissionGate' || true
          )"
          HEAD_ADMISSION_POLICY_SHA256="$(
            git show "$PR_HEAD_SHA:scripts/workflow-policy-check.mjs" \
              | sha256sum | awk '{print $1}'
          )"
          BOOTSTRAP_STATE=protected
          test "$PR_NUMBER" = "857" \
            && test "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" \
            && test "$BASE_HAS_ADMISSION_POLICY" -eq 0 \
            && test "$HEAD_HAS_ADMISSION_POLICY" -gt 0 \
            && test "$HEAD_ADMISSION_POLICY_SHA256" = "$EXPECTED_ADMISSION_POLICY_SHA256" \
            && test "$PR_HEAD_REF" = "fix/675-main-context-admission" \
            && test "$PR_TITLE" = "ci(governance): prove main-context changelog truth before merge" \
            && git diff --quiet "$PR_BASE_SHA" "$PR_HEAD_SHA" -- scripts/check-reviewer-config.mjs \
            && BOOTSTRAP_STATE=authorised \
            || enforce_protected_policy_diff
          echo "::notice::admission-policy protection state: $BOOTSTRAP_STATE"
          SYMLINKS="$(git ls-tree -r --full-tree "$PR_HEAD_SHA" -- | awk '$1 == "120000" { print $0 }')"
          if [ -n "$SYMLINKS" ]; then
            echo "::error::PR archive contains symlinks; refusing to follow untrusted archive links"
            printf '%s\n' "$SYMLINKS"
            exit 1
          fi
          PR_ROOT="$(mktemp -d)"
          git archive "refs/remotes/origin/pr/${PR_NUMBER}" | tar -x -C "$PR_ROOT"
          WORKFLOW_POLICY_ROOT="$PR_ROOT" \
            node "$GITHUB_WORKSPACE/scripts/workflow-policy-check.mjs"
          REVIEWER_CONFIG_ROOT="$PR_ROOT" \
            REVIEWER_DEPENDENCY_ROOT="$GITHUB_WORKSPACE" \
            node scripts/check-reviewer-config.mjs
