# Evidence branch only (never merged), #1272/#1273: production-build worker behaviour on the exact PR #1273 head
# (`fix`), with a negative control that sets #1273's production files back to main (`main-control`). The job fails
# unless `fix` passes and `main-control` fails.
name: Worker bundles evidence r3 (PR #1273)

on:
  push:
    branches: [evidence/worker-bundles-1272-r3]

permissions:
  contents: read

jobs:
  production-workers:
    strategy:
      fail-fast: false
      matrix:
        variant: [fix, main-control]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Negative control - set the production files of PR #1273 back to main
        if: matrix.variant == 'main-control'
        run: >-
          git checkout origin/main -- package.json packages/worker-bus/src/types.ts
          packages/worker-bus/src/workerPool.ts services/workerBusManager.ts vite.config.ts
          scripts/runtime-asset-steps.mjs scripts/runtime-asset-steps.d.mts
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm run build
      - name: Production-build worker run
        id: run
        continue-on-error: true
        env:
          CI: 'true'
          RUN_DEEP_E2E: '1'
        run: pnpm exec playwright test -c playwright.worker-evidence.config.ts tests/e2e/deep/workers/worker-bundles-evidence.spec.ts --project=chromium --retries=0 --reporter=line
      - name: Evidence summary
        if: always()
        run: cat test-results/worker-evidence-summary.json || echo "no summary written"
      - name: Expected outcome
        env:
          VARIANT: ${{ matrix.variant }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          echo "variant=$VARIANT outcome=$OUTCOME"
          if [ "$VARIANT" = "fix" ]; then test "$OUTCOME" = "success"; else test "$OUTCOME" = "failure"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-evidence-${{ matrix.variant }}
          path: |
            tests/e2e/html-report
            test-results
          retention-days: 14
