version: 2
updates:
  # npm / pnpm workspaces
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # QNBS-v3: cooldown delays Dependabot PRs until a release has aged 7 days — matched to the
    # .npmrc `minimum-release-age=10080` (7-day) supply-chain policy, so a freshly-published
    # version is never PR'd before `pnpm install --frozen-lockfile` would accept it (avoids
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION CI failures like #154/#155). The .npmrc gate is
    # install-time only; this cooldown is the PR-creation-time counterpart.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # QNBS-v3: react and react-dom must stay in lockstep; split bumps cause version-mismatch errors at test time.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Group dev-tooling updates together to reduce PR noise
      dev-tooling:
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - 'playwright*'
          - '@playwright/*'
          - 'storybook*'
          - '@storybook/*'
          - 'biome*'
          - 'stryker*'
          - '@stryker-mutator/*'
    ignore:
      - dependency-name: '@stryker-mutator/api'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@stryker-mutator/core'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@stryker-mutator/vitest-runner'
        update-types:
          - 'version-update:semver-major'

  # Cargo / Rust (Tauri desktop backend)
  # QNBS-v3: separate from npm — Cargo updates affect src-tauri/ only; group all together to reduce PR noise
  # QNBS-v3: no cross-ecosystem coupling with the npm @tauri-apps/plugin-* counterparts — a multi-ecosystem-groups attempt was investigated and reverted as unsafe to verify, see docs/DEPENDABOT-TRIAGE.md.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      tauri-deps:
        patterns:
          - 'tauri*'
          - 'tauri-*'
          - 'wry'
          - 'tao'

  # Cargo / Rust (renderer-neutral Core, independent workspace — see docs/native/CORE-MIGRATION-LEDGER.md)
  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # init/autobuild/analyze/upload-sarif subpaths must move together — see docs/DEPENDABOT-TRIAGE.md
      codeql-action:
        patterns:
          - 'github/codeql-action*'
