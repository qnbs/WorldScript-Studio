version: 2
# QNBS-v3: consolidates a Rust tauri-plugin-* bump with its npm @tauri-apps/plugin-* counterpart into one PR when both ecosystems have matching updates — the parity checker stays the fail-closed authority regardless (see docs/DEPENDABOT-TRIAGE.md).
multi-ecosystem-groups:
  tauri-plugins:
    schedule:
      interval: weekly
      day: monday
updates:
  # npm / pnpm workspaces
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # QNBS-v3: cooldown delays Dependabot PRs until a release has aged 7 days — matched to the
    # .npmrc `minimum-release-age=10080` (7-day) supply-chain policy, so a freshly-published
    # version is never PR'd before `pnpm install --frozen-lockfile` would accept it (avoids
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION CI failures like #154/#155). The .npmrc gate is
    # install-time only; this cooldown is the PR-creation-time counterpart.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # QNBS-v3: react and react-dom must stay in lockstep; split bumps cause version-mismatch errors at test time.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Group dev-tooling updates together to reduce PR noise
      dev-tooling:
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - 'playwright*'
          - '@playwright/*'
          - 'storybook*'
          - '@storybook/*'
          - 'biome*'
          - 'stryker*'
          - '@stryker-mutator/*'
    # QNBS-v3: joins the top-level tauri-plugins multi-ecosystem-group defined above.
    patterns:
      - '@tauri-apps/plugin-*'
    multi-ecosystem-group: tauri-plugins

  # Cargo / Rust (Tauri desktop backend)
  # QNBS-v3: separate from npm — Cargo updates affect src-tauri/ only; group all together to reduce PR noise
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # QNBS-v3: excludes tauri-plugin-* so a crate never double-joins both this group and the tauri-plugins multi-ecosystem-group below.
      tauri-deps:
        patterns:
          - 'tauri*'
          - 'tauri-*'
          - 'wry'
          - 'tao'
        exclude-patterns:
          - 'tauri-plugin-*'
    # QNBS-v3: joins the top-level tauri-plugins multi-ecosystem-group with its npm @tauri-apps/plugin-* counterparts — this gap caused v1.28.5 (see docs/DEPENDABOT-TRIAGE.md).
    patterns:
      - 'tauri-plugin-*'
    multi-ecosystem-group: tauri-plugins

  # Cargo / Rust (renderer-neutral Core, independent workspace — see docs/native/CORE-MIGRATION-LEDGER.md)
  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # init/autobuild/analyze/upload-sarif subpaths must move together — see docs/DEPENDABOT-TRIAGE.md
      codeql-action:
        patterns:
          - 'github/codeql-action*'
