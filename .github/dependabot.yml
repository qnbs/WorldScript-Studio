version: 2
updates:
  # npm / pnpm workspaces
  - package-ecosystem: npm
    directory: /
    # Monthly version updates: each merge runs the full successor/CI/retention procedure in
    # docs/DEPENDABOT-TRIAGE.md, so fewer, grouped PRs. Security updates are not scheduled and still
    # open immediately.
    schedule:
      interval: monthly
    # QNBS-v3: cooldown delays Dependabot PRs until a release has aged 7 days — matched to the
    # .npmrc `minimum-release-age=10080` (7-day) supply-chain policy, so a freshly-published
    # version is never PR'd before `pnpm install --frozen-lockfile` would accept it (avoids
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION CI failures like #154/#155). The .npmrc gate is
    # install-time only; this cooldown is the PR-creation-time counterpart.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # QNBS-v3: react and react-dom must stay in lockstep; split bumps cause version-mismatch errors at test time.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Group dev-tooling updates together to reduce PR noise
      dev-tooling:
        # Keep breaking migrations as independently reviewable PRs; omitted majors remain discoverable.
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - 'playwright*'
          - '@playwright/*'
          - 'storybook*'
          - '@storybook/*'
          - 'biome*'
          - '@biomejs/*'
          - 'stryker*'
          - '@stryker-mutator/*'
      # Every other minor/patch update in one PR. vite, @huggingface/transformers and zod keep their
      # own PRs because docs/DEPENDABOT-TRIAGE.md requires extra checks for them; majors that are not ignored stay separate.
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
        exclude-patterns:
          - 'vite'
          - '@huggingface/transformers'
          - 'zod'
    ignore:
      - dependency-name: '@stryker-mutator/api'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@stryker-mutator/core'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@stryker-mutator/vitest-runner'
        update-types:
          - 'version-update:semver-major'

  # Cargo / Rust (Tauri desktop backend)
  # QNBS-v3: separate from npm — Cargo updates affect src-tauri/ only; group all together to reduce PR noise
  # QNBS-v3: no cross-ecosystem coupling with the npm @tauri-apps/plugin-* counterparts — a multi-ecosystem-groups attempt was investigated and reverted as unsafe to verify, see docs/DEPENDABOT-TRIAGE.md.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Minor/patch only: a Tauri major arrives as its own PR for a full review.
      tauri-deps:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'tauri*'
          - 'tauri-*'
          - 'wry'
          - 'tao'
      cargo-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  # Cargo / Rust (renderer-neutral Core, independent workspace — see docs/native/CORE-MIGRATION-LEDGER.md)
  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      core-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
    # The pins documented in crates/worldscript-secure-storage/Cargo.toml: each next line needs Rust
    # above the Core floor 1.77.2 (or, for windows-sys and getrandom, is not admitted). Only minor and
    # major version updates are ignored, so patches inside a held line still arrive. A fix that exists
    # only in a newer line still shows as a Dependabot alert and fails the required OSV gate.
    ignore:
      - dependency-name: 'argon2'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'base64ct'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'getrandom'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'sha2'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'zeroize'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'zeroize_derive'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'keyring'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'dbus-secret-service'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'security-framework'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'windows-sys'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # init/autobuild/analyze/upload-sarif subpaths must move together — see docs/DEPENDABOT-TRIAGE.md
      codeql-action:
        patterns:
          - 'github/codeql-action*'
      actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
