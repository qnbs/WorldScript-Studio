name: Setup Node + pnpm
description: >
  Checkout, configure pnpm, setup Node (from .nvmrc or explicit version), install
  frozen dependencies. Centralises the repeated 4-step block used by every CI job.

inputs:
  node-version-file:
    description: Path to version file (.nvmrc) — used when node-version is empty
    default: '.nvmrc'
  node-version:
    description: >
      Explicit Node version string (e.g. 'lts/*', 'node', '22'). When non-empty,
      takes precedence over node-version-file. Leave blank for most jobs.
    default: ''

runs:
  using: composite
  steps:
    # QNBS-v3: pnpm/setup verifies a SHA-256-checked standalone binary, replacing pnpm/action-setup's npm-based installer (measured 20s-6min variance); caching left unchanged below to isolate this one variable.
    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        version: 11.22.0
        install: false

    # QNBS-v3: When node-version is set (matrix), use it; otherwise read .nvmrc so
    # non-matrix jobs stay pinned to the project's declared Node version.
    # Node 24 compatibility: actions/setup-node v6.5.0 handles both LTS versions correctly.
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
        cache: pnpm

    - name: Assert toolchain
      run: |
        export npm_config_user_agent="pnpm/$(pnpm --version)"
        node scripts/check-pnpm-toolchain.mjs
      shell: bash

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
