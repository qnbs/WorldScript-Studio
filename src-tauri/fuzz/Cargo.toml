[package]
name = "storycraft-fuzz"
version = "0.0.1"
publish = false
edition = "2021"
# QNBS-v3: this crate's Cargo.lock is format v4 (stabilized in Cargo 1.83), independent of the
# parent crate's 1.77.2 MSRV — fuzzing is dev-only tooling, never shipped, and cargo-fuzz itself
# already requires a recent nightly toolchain. Declaring this makes an older toolchain fail with a
# clear "requires 1.83" error instead of a confusing lockfile-parse failure.
rust-version = "1.83"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Fuzz targets are compiled as separate binaries so we need the main crate as a dependency.
# The package is named "worldscript-studio" (its [lib] target is "app_lib") — the package
# override below is required or cargo cannot resolve this path dependency at all.
[dependencies.app_lib]
path = ".."
package = "worldscript-studio"

[[bin]]
name = "fuzz_file_name_sanitization"
path = "fuzz_targets/fuzz_file_name_sanitization.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
