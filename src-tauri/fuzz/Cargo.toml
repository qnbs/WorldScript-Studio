[package]
name = "storycraft-fuzz"
version = "0.0.1"
publish = false
edition = "2021"
# QNBS-v3: this dev-only fuzz graph resolves dependencies requiring Rust 1.89, so its declared MSRV must fail clearly before Cargo evaluates the lockfile.
rust-version = "1.89"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Fuzz targets are compiled as separate binaries so we need the main crate as a dependency.
# The package is named "worldscript-studio" (its [lib] target is "app_lib") — the package
# override below is required or cargo cannot resolve this path dependency at all.
[dependencies.app_lib]
path = ".."
package = "worldscript-studio"

[[bin]]
name = "fuzz_file_name_sanitization"
path = "fuzz_targets/fuzz_file_name_sanitization.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
