# ─── npm advisories (pnpm-lock.yaml) ─────────────────────────────────────────
# Reviewed 2026-06-16 / 2026-07-26 / 2026-08-12 / 2026-09-08. Most
# currently-flagged npm advisories are remediated via pnpm-workspace.yaml
# overrides (tmp, ws, form-data, protobufjs, @babel/core, dompurify→3.4.16,
# js-yaml→4.3.2, body-parser→1.20.6, joi→18.2.6, sharp→0.35.4, …). (The former
# dompurify GHSA-x4vx-rjvf-j5p4 and js-yaml-3.x GHSA-h67p-54hq-rp68 ignores
# were dropped: both advisories no longer match the lockfile after the
# overrides.) The two extract-zip ignores formerly here (GHSA-jmr9-qjv8-65gv,
# GHSA-7pqw-9j4j-h8q3) were removed 2026-09-10: pnpm-workspace.yaml's
# overrides.lighthouse now forces @lhci/cli's Lighthouse/Puppeteer chain to a
# version whose @puppeteer/browsers dependency replaced extract-zip with
# modern-tar, eliminating the package from the resolved graph entirely — see
# AUDIT.md's 2026-09-10 entry. The former adm-zip ignore was removed on 2026-09-19
# after pnpm audit was clean and the resolved 0.6.1 version was outside the GHSA-vwc7
# vulnerable range (the GitHub API still leaves its first_patched_version unset). The current
# advisory set is GHSA-xcpc-8h2w-3j85 (fixed in 0.6.0), GHSA-7q85-xj36-vmfc (0.6.1), and
# GHSA-vwc7-r8mq-g2x9 (direct 0.6.1 tarball extraction guard); the workspace floor covers all three.
# The `allowBuilds: { onnxruntime-node: false }` control remains in force as
# defense-in-depth for the transitive package's install-time lifecycle script. npm registry
# metadata dates 0.6.1 to 2026-09-11; a direct 0.6.0/0.6.1 tarball comparison confirmed the
# extraction fix's `assertPathSafe`/`lstat` rejection of pre-existing symlink components.

# ─── npm development tooling without a compatible fix (2026-11-05, #1146 / #1163) ───
# ACCEPTED TIME-BOUNDED VULNERABILITIES, NOT FIXES. OSV filters an IgnoredVulns entry for the
# whole advisory, not for one version, lockfile or call site. The guard around the wider waiver is
# tests/unit/security/osvNpmDependencyFloors.test.ts: it fails when an affected copy, an affected
# copy's parent package, or a production path appears, or when no affected copy is left (stale
# waiver). Full per-advisory record, alternatives and re-check trigger: AUDIT.md (2026-11-05).
# Every entry expires on 2026-11-30 at the latest; remove it as soon as a parent ships a fix.

