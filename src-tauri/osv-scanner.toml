# ─── zbus 4/5 sub-crates: zvariant, zbus_names, zvariant_derive ──────────────
# RUSTSEC-2026-0370/-0371/-0372 are "unmaintained" notices with no CVE, no CVSS
# and no fixed version: the three crates were folded into zbus 6.0 (its `wire`
# and `names` modules and derive macros), so they stop receiving releases.
# src-tauri/Cargo.lock (5.12 / 4.3.2): Linux-only, through
# tauri-plugin-notification and tauri-plugin-single-instance. Every published
# line of both plugins, including 2.7.0 / 2.5.4 and the 3.0.0 alphas, requires
# zbus ^5, so no dependency update reaches zbus 6 today.
# crates/Cargo.lock (4.2.0 / 3.0.0): a lockfile-only edge. keyring 3.6.3's
# `crypto-rust` feature also names `secret-service?/crypto-rust`, which keeps
# secret-service 4 -> zbus 4 in the lockfile although no target compiles it
# (WorldScript uses the dbus-secret-service backend). Dropping `crypto-rust`
# is not an option: keyring would then open the Secret Service session as
# `Plain` instead of the encrypted `Dh` session.
# Drop these entries once Tauri's Linux plugins move to zbus 6 and keyring no
# longer names secret-service.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = "zvariant 5.12.0 / 4.2.0: unmaintained (merged into zbus 6.0); no CVE or fix. Linux-only via Tauri notification/single-instance (zbus ^5 on every plugin line) and a never-compiled keyring weak edge in crates/Cargo.lock"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = "zbus_names 4.3.2 / 3.0.0: unmaintained (merged into zbus 6.0); no CVE or fix. Same Linux-only Tauri plugin path and never-compiled keyring weak edge as RUSTSEC-2026-0370"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = "zvariant_derive 5.12.0 / 4.2.0: unmaintained (macros provided by zbus 6.0); no CVE or fix. Same Linux-only Tauri plugin path and never-compiled keyring weak edge as RUSTSEC-2026-0370"

