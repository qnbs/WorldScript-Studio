# osv-scanner ignore list for src-tauri/Cargo.lock + crates/Cargo.lock + pnpm-lock.yaml
# All entries have been evaluated and accepted by the maintainer.
# Reviewed: 2026-09-20 (Rust) / 2026-09-19 (npm) / 2026-10-20 (zbus family, #911) / 2026-11-05 (npm deepmerge + zod 3, #1146)

# ─── GTK3 Rust bindings (Linux WebKit stack) ────────────────────────────────
# webkit2gtk 2.0.2 (required by wry 0.55.x / Tauri 2.x for Linux) depends on
# the 0.18.x series of GTK3 Rust bindings. These crates are marked "unmaintained"
# in the advisory DB because they were superseded by the gtk4 crate series.
# No patched 0.18.x version exists and upgrading to 0.19+ would require a major
# breaking change in Tauri's Linux WebView stack (webkit2gtk → webkit2gtk-4.1).
# These crates only affect Linux desktop builds; the PWA is unaffected.

## RUSTSEC-2024-0411..0420 were removed on 2026-09-20 after the exact CI
## OSV invocation reported them as unused ignores against all three lockfiles.
## The GTK3 crates remain in Cargo.lock, but the current scanner no longer
## matches those advisory IDs. RUSTSEC-2024-0429 below remains active.


[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = "2026-11-30T00:00:00Z"
reason = "glib 0.18.5 (CVSS 6.9, GHSA-wrw7-89jp-8q8g): memory safety issue in GTK3 glib Rust binding; only exploitable on Linux desktop via WebKit process; glib 0.22.x fixes it but requires webkit2gtk 4.1+ which Tauri 2.x does not yet support on this platform. Track upstream: https://github.com/tauri-apps/wry/issues"

