[package]
name = "worldscript-studio"
version = "1.29.1"
description = "AI-powered creative writing and world-building application"
authors = ["QNBS"]
license = "MIT"
repository = "https://github.com/QNBS/WorldScript-Studio"
edition = "2021"
# Declared floor for the desktop app (#572): the locked graph already needs 1.89 (notify-rust 4.18),
# and the current Tauri plugin lines need 1.90. CI builds it with exactly this toolchain.
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.23"
log = "0.4"
# QNBS-v3 (T2): tray-icon enables the system-tray APIs (JS @tauri-apps/api/tray builds the tray).
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Held at 2.12.x until the Tauri plugin group update is admitted (#572).
# No `zip` feature (#911): it only unpacks the v1 `.zip` / `.tar.gz` updater bundles, and
# `createUpdaterArtifacts: true` ships the raw `-setup.exe` / `.msi` / `.AppImage` instead. macOS
# keeps its `.app.tar.gz` path, whose `tar` and `flate2` are not behind this feature.
tauri-plugin-updater = { version = "~2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# QNBS-v3 (T3): native OS notifications (background-task completion), permission-gated in JS.
tauri-plugin-notification = "2"
# QNBS-v3 (#332/D3): exposes exit() to JS so the tray/menu Quit items can flush state before actually terminating the process.
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync", "time", "process", "rt-multi-thread"] }
worldscript-project = { path = "../crates/worldscript-project" }

[dev-dependencies]
minisign-verify = "0.2.5"

[profile.release]
# QNBS-v3: Aggressive size + speed optimizations for desktop bundles
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[features]
default = []
