<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Manifest & Icons ───────────────────────────────── -->
    <!-- QNBS-v3: %BASE_URL% substituted by Vite at build time — resolves to / for Vercel/CF edge and /WorldScript-Studio/ for GitHub Pages. -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <!-- ── Viewport & Theme ──────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- ── SEO & Social ───────────────────────────────────── -->
    <meta name="description" content="AI-Powered Creative Writing Studio — craft entire novels, characters & worlds with Gemini AI. Works offline." />
    <meta name="keywords" content="creative writing, AI writing assistant, novel writer, story generator, character builder, world building" />
    <meta name="author" content="WorldScript Studio" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="WorldScript Studio" />
    <meta property="og:title"       content="WorldScript Studio — AI Creative Writing" />
    <meta property="og:description" content="Build immersive worlds and craft entire novels with AI. Works offline as a PWA." />
    <meta property="og:url"         content="https://worldscript-studio.app%BASE_URL%" />
    <meta property="og:image"       content="%BASE_URL%favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="WorldScript Studio" />
    <meta name="twitter:description" content="AI-Powered Creative Writing Studio — offline-ready PWA." />
    <meta name="twitter:image"       content="%BASE_URL%favicon.svg" />

    <!-- ── PWA / Mobile Capable ──────────────────────────── -->
    <meta name="mobile-web-app-capable"            content="yes" />
    <meta name="apple-mobile-web-app-capable"      content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"        content="WorldScript" />
    <meta name="msapplication-TileColor"           content="#020617" />
    <meta name="msapplication-tap-highlight"       content="no" />
    <meta name="application-name"                  content="WorldScript Studio" />

    <!-- ── Security: Content Security Policy ─────────────── -->
    <!--
      CSP-Strategie:
      - script-src: eigene Skripte (Vite ES modules) + 'wasm-unsafe-eval' — REQUIRED for
        WebAssembly.compile/instantiate, used by WebLLM, ONNX Runtime Web, Transformers.js,
        DuckDB-WASM, Whisper-STT, and Kokoro-TTS (the local-inference stack). NOT the broader
        unsafe-eval keyword, which is forbidden; wasm-unsafe-eval only lifts the WASM restriction.
        No inline script (moved to index.tsx as of ADR-0013 — see docs/adr/0013-csp-wasm-and-blob-frames.md).
      - frame-src: 'self' blob: — Binder-PDF-preview and ManuscriptResearchSplit iframes render
        from Blob URLs (IndexedDB-backed assets, no same-origin static file to point at instead).
      - style-src: eigene + unsafe-inline (React inline-styles) — keine Fremd-Font-CDN mehr,
        CJK/Greek sind über @fontsource self-hosted (siehe index.tsx)
      - font-src: self + data: — keine Fremd-Font-CDN mehr nötig (self-hosted, siehe index.tsx)
      - connect-src: 'self'
                    + https:  — intentional broad HTTPS scheme-source. REQUIRED by the
                      shipped BYOK feature `openAiCompatibleBaseUrl` (Settings → AI →
                      custom base URL): users point WorldScript at arbitrary self-hosted
                      or third-party OpenAI-compatible proxies that cannot be statically
                      enumerated in a meta CSP. Because `https:` already covers every
                      HTTPS origin, the explicit cloud-provider endpoints (Gemini,
                      OpenAI, xAI, Groq, OpenRouter) were REMOVED as dead allowlist
                      entries — keeping them implied a hardening that `https:` negates.
                      Decision recorded in docs/adr/0004-csp-connect-src-byok-tradeoff.md.
                    + http://localhost|127.0.0.1 (:11434 Ollama, :1234 LM Studio,
                      :8000 local AI) — NOT covered by `https:`, so kept explicit.
                    + wss:// Yjs signaling — explicit endpoints only, no ws: wildcard.
                    The native Tauri build (src-tauri/tauri.conf.json) keeps a STRICT
                    connect-src with no `https:` blanket; only the web PWA accepts the
                    broader scheme for BYOK. See ADR-0004 for the web-vs-Tauri rationale.
      - img-src: data: URLs für Base64-Bilder erlaubt
      - Produktions-CSP wird über HTTP-Header des Hosts verschärft (siehe ADR-0004, docs/DEPLOYMENT.md)
    -->
    <meta http-equiv="Content-Security-Policy"
          content="
            default-src 'self';
            script-src  'self' 'wasm-unsafe-eval';
            style-src   'self' 'unsafe-inline';
            font-src    'self' data:;
            img-src     'self' data: blob:;
            connect-src 'self' https: http://localhost:11434 http://127.0.0.1:11434 http://localhost:1234 http://127.0.0.1:1234 http://localhost:8000 http://127.0.0.1:8000 wss://y-webrtc-signaling.fly.dev wss://signaling.yjs.dev;
            worker-src  'self' blob:;
            frame-src   'self' blob:;
            manifest-src 'self';
            object-src  'none';
            base-uri    'self';
            form-action 'self';
            frame-ancestors 'none';
            upgrade-insecure-requests;
          " />

    <!-- QNBS-v3: CJK/Greek self-hosted via @fontsource in index.tsx (no external font CDN) — "Noto Sans GR" doesn't exist at Google Fonts and 400'd the combined request, silently dropping JP/KR too. -->

    <title>WorldScript Studio</title>
</head>
  <body>
    <!-- QNBS-v3: Aurora low-end-hardware disable moved to index.tsx (ADR-0013) — an inline
         script element here would need the unsafe-inline keyword or a hash in script-src; a
         same-origin module keeps script-src minimal. -->
    <div class="noise-overlay"></div>
    <div class="aurora-container">
      <div class="aurora-blob blob-1"></div>
      <div class="aurora-blob blob-2"></div>
      <div class="aurora-blob blob-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
