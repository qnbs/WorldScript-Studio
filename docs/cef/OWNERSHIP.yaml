# CEF documentation ownership manifest
#
# Per ROADMAP-CEF-DESKTOP-MIGRATION.md §80.1 / Appendix M.3.
# Tier A = release/security-critical (90-day review cadence).
# Tier B = architecture/reference (180-day review cadence).
# Tier C = explanatory/how-to (as-needed).
#
# `driftCheckTool` for every entry below is intentionally "planned — not implemented"
# as of Wave 0 (see roadmap §80.1.3): building a docs:cef-check stub now would add an
# npm script and CI job with nothing real to check drift against, since no CEF code
# exists yet. Revisit at Wave 1, not silently forgotten.

documents:
