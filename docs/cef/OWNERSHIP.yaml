# Owner/backup roles above are role placeholders (roadmap §80.1.8: prefer role/subsystem
# ownership over one person's name, e.g. via CODEOWNERS mapping). Assigning real
# maintainer handles to each role is Wave 1+ operational work, not a Wave 0 blocker.
roles:
  desktop-architecture: "unassigned — maps to whoever owns ADR-0019 and the roadmap"
  cef-runtime: "unassigned — maps to whoever implements the CEF host (Wave 2+)"
  rust-core: "unassigned — maps to whoever owns worldscript-core/-storage/-crypto"
  desktop-security: "unassigned — maps to whoever owns the CEF security review (Wave 14)"
